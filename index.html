<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Against Humanity Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            border: 1px solid #444;
            box-sizing: border-box;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #3700b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>CAH Clone</h2>
        <p>Enter password to access the game:</p>
        <input type="password" id="password-input" placeholder="Password">
        <button onclick="checkPassword()">Enter Lobby</button>
    </div>

    <!-- Firebase SDK Modular Imports via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCx_cYc7rA03ohzMqeuti5gG1qa1K7JVrM",
            authDomain: "cah-clone-b60b4.firebaseapp.com",
            databaseURL: "https://cah-clone-b60b4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cah-clone-b60b4",
            storageBucket: "cah-clone-b60b4.appspot.com",
            messagingSenderId: "976107171722",
            appId: "1:976107171722:web:9edca7e092d80d20912273"

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Make database globally accessible
        window.db = db;
    </script>

    <script>
        // Helper function to create a SHA-256 hash of the input password
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        async function checkPassword() {
            const pass = document.getElementById('password-input').value;
            
            // This is the SHA-256 hash for "admin123"
            const correctHash = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
            
            const userHash = await sha256(pass);

            if (userHash === correctHash) {
                alert("Access granted! Next we will build the room creation screen.");
            } else {
                alert("Incorrect password.");
            }
        }
    </script>
</body>
</html>
