<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Against Humanity Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            box-sizing: border-box;
            font-size: 16px;
        }
        input {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #3700b3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background-color: #cf6679; color: #000; }
        .btn-secondary { background-color: #03dac6; color: #000; margin-top: 10px; }
        .btn-warning { background-color: #ffb74d; color: #000; margin-top: 10px; }
        .hidden { display: none !important; }
        .muted { color: #888; }
        .small { font-size: 12px; }
        .error-banner {
            background-color: #cf6679;
            color: #000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            text-align: left;
        }
        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            text-align: left;
        }
        .setting input { width: 80px; margin-top: 0; text-align: center; }
        .room-item {
            background-color: #2a2a2a;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .room-item button {
            width: auto;
            padding: 8px 14px;
            margin-top: 0;
            font-size: 14px;
            background-color: #03dac6;
            color: #000;
        }
        ul { padding-left: 20px; text-align: left; }
        #timer-display {
            font-size: 20px;
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }
        #round-info { color: #aaa; font-size: 14px; }

        /* Black card */
        #black-card-container { margin-top: 15px; display: flex; justify-content: center; }
        .black-card {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #444;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            max-width: 280px;
            min-height: 120px;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .black-text { white-space: pre-wrap; word-break: break-word; }
        .black-card .fill { background: #ffffff; color: #000; border-radius: 3px; padding: 0 4px; }
        .black-card .blank { border-bottom: 2px solid #888; }
        .card-foot { font-size: 11px; color: #aaa; margin-top: 10px; }

        /* Table */
        #table-heading { margin: 15px 0 5px 0; color: #aaa; }
        #table-container {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 100px;
            background-color: #121212;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #444;
        }
        #table-container .muted { margin: auto; font-size: 14px; }
        .table-card {
            background-color: #ffffff;
            color: #000000;
            padding: 10px;
            border-radius: 6px;
            width: 130px;
            min-height: 140px;
            font-size: 12px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }
        .table-card .answer { margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
        .table-card .foot { font-size: 10px; color: #333; margin-top: 5px; }
        .table-card.voted { border-color: #03dac6; }
        .table-card.winner { border-color: #ffb74d; background-color: #fff8e1; }
        .table-card button { padding: 6px; font-size: 11px; margin-top: 6px; background-color: #6200ee; }

        /* Hand */
        #hand-heading { margin: 15px 0 0 0; color: #aaa; }
        #hand-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; justify-content: center; }
        .white-card {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 6px;
            width: 110px;
            height: 150px;
            font-size: 12px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid transparent;
            position: relative;
        }
        .white-card .txt { white-space: pre-wrap; word-break: break-word; overflow-y: auto; }
        .white-card:hover { background-color: #e0e0e0; transform: translateY(-3px); transition: 0.2s; }
        .white-card.selected { border-color: #6200ee; transform: translateY(-5px); }
        .white-card.disabled { opacity: 0.6; cursor: default; }
        .white-card.disabled:hover { background-color: #ffffff; transform: none; }
