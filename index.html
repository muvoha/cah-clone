<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Against Humanity Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            box-sizing: border-box;
            font-size: 16px;
        }
        input {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color: #3700b3;
        }
        .btn-danger {
            background-color: #cf6679;
            color: #000;
        }
        .btn-secondary {
            background-color: #03dac6;
            color: #000;
            margin-top: 10px;
        }
        .btn-warning {
            background-color: #ffb74d;
            color: #000;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .room-item {
            background-color: #2a2a2a;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .room-item button {
            width: auto;
            padding: 8px 14px;
            margin-top: 0;
            font-size: 14px;
            background-color: #03dac6;
            color: #000;
        }
        ul {
            padding-left: 20px;
            text-align: left;
        }
        #timer-display {
            font-size: 20px;
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }
        /* Black Card Styling */
        #black-card-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }
        .black-card {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #444;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            max-width: 260px;
            min-height: 120px;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* Table / Submissions Area */
        #table-container {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 100px;
            background-color: #121212;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #444;
        }
        .table-card {
            background-color: #ffffff;
            color: #000000;
            padding: 10px;
            border-radius: 6px;
            width: 110px;
            min-height: 140px;
            font-size: 12px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }
        .table-card.voted {
            border: 3px solid #03dac6;
        }
        .table-card.winner {
            border: 3px solid #ffb74d;
            background-color: #fff8e1;
        }
        .table-card button {
            padding: 6px;
            font-size: 11px;
            margin-top: 6px;
            background-color: #6200ee;
        }
        /* White Card & Selection Styling */
        #hand-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .white-card {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 6px;
            width: 110px;
            height: 140px;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }
        .white-card:hover {
            background-color: #e0e0e0;
            transform: translateY(-3px);
            transition: 0.2s;
        }
        .white-card.selected {
            border: 3px solid #6200ee;
            transform: translateY(-5px);
        }
        .white-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- PASSWORD SCREEN -->
    <div id="password-screen" class="container">
        <h2>CAH Clone</h2>
        <p>Enter password to access:</p>
        <input type="password" id="password-input" placeholder="Password">
        <button onclick="checkPassword()">Enter</button>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="container hidden">
        <h2>Game Lobby</h2>
        <input type="text" id="player-name" placeholder="Enter your player name">
        <button onclick="createRoom()">Create New Room</button>
        
        <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
        
        <h3>Available Rooms</h3>
        <div id="rooms-list">
            <p style="color: #888;">Loading rooms...</p>
        </div>
        <button class="btn-secondary" onclick="cleanupStaleRooms()">Clear Empty Rooms</button>
    </div>

    <!-- ACTIVE ROOM SCREEN -->
    <div id="room-screen" class="container hidden">
        <h2 id="room-title">Room</h2>
        <div id="timer-display" class="hidden">Time Left: <span id="timer-sec">30</span>s</div>
        
        <h3>Players in Room:</h3>
        <ul id="player-list"></ul>

        <!-- START GAME BUTTON -->
        <button id="start-game-btn" class="btn-secondary hidden" onclick="startNewGame()">Start Game</button>

        <!-- AREA WHERE BLACK CARD WILL SHOW UP -->
        <div id="black-card-container"></div>

        <!-- SHARED TABLE / SUBMISSIONS AREA -->
        <h4 style="margin: 15px 0 5px 0; color: #aaa;" id="table-heading">Round Table (Submissions):</h4>
        <div id="table-container">
            <p style="color: #666; font-size: 13px; margin: auto;">No cards submitted yet.</p>
        </div>

        <!-- AREA WHERE WHITE CARDS WILL SHOW UP -->
        <div id="hand-container"></div>

        <!-- CONFIRM / UNDO SUBMISSION BUTTONS -->
        <button id="submit-card-btn" class="btn-secondary hidden" onclick="confirmSubmission()">Lock In Final Submission</button>
        <button id="undo-card-btn" class="btn-warning hidden" onclick="undoSubmission()">Undo Submission</button>

        <button class="btn-danger" style="margin-top: 15px;" onclick="leaveRoom()">Leave Room</button>
    </div>
