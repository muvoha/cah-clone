<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Against Humanity Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            box-sizing: border-box;
            font-size: 16px;
        }
        input {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color: #3700b3;
        }
        .btn-danger {
            background-color: #cf6679;
            color: #000;
        }
        .btn-secondary {
            background-color: #03dac6;
            color: #000;
            margin-top: 10px;
        }
        .btn-warning {
            background-color: #ffb74d;
            color: #000;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .room-item {
            background-color: #2a2a2a;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .room-item button {
            width: auto;
            padding: 8px 14px;
            margin-top: 0;
            font-size: 14px;
            background-color: #03dac6;
            color: #000;
        }
        ul {
            padding-left: 20px;
            text-align: left;
        }
        #timer-display {
            font-size: 20px;
            font-weight: bold;
            color: #ff4081;
            margin: 10px 0;
        }
        /* Black Card Styling */
        #black-card-container {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }
        .black-card {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #444;
            padding: 16px;
            border-radius: 8px;
            width: 100%;
            max-width: 260px;
            min-height: 120px;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* Table / Submissions Area */
        #table-container {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 100px;
            background-color: #121212;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #444;
        }
        .table-card {
            background-color: #ffffff;
            color: #000000;
            padding: 10px;
            border-radius: 6px;
            width: 110px;
            min-height: 140px;
            font-size: 12px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }
        .table-card.voted {
            border: 3px solid #03dac6;
        }
        .table-card button {
            padding: 6px;
            font-size: 11px;
            margin-top: 6px;
            background-color: #6200ee;
        }
        /* White Card & Selection Styling */
        #hand-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        .white-card {
            background-color: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 6px;
            width: 110px;
            height: 140px;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }
        .white-card:hover {
            background-color: #e0e0e0;
            transform: translateY(-3px);
            transition: 0.2s;
        }
        .white-card.selected {
            border: 3px solid #6200ee;
            transform: translateY(-5px);
        }
        .white-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- PASSWORD SCREEN -->
    <div id="password-screen" class="container">
        <h2>CAH Clone</h2>
        <p>Enter password to access:</p>
        <input type="password" id="password-input" placeholder="Password">
        <button onclick="checkPassword()">Enter</button>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="container hidden">
        <h2>Game Lobby</h2>
        <input type="text" id="player-name" placeholder="Enter your player name">
        <button onclick="createRoom()">Create New Room</button>
        
        <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
        
        <h3>Available Rooms</h3>
        <div id="rooms-list">
            <p style="color: #888;">Loading rooms...</p>
        </div>
        <button class="btn-secondary" onclick="cleanupStaleRooms()">Clear Empty Rooms</button>
    </div>

    <!-- ACTIVE ROOM SCREEN -->
    <div id="room-screen" class="container hidden">
        <h2 id="room-title">Room</h2>
        <div id="timer-display" class="hidden">Time Left: <span id="timer-sec">30</span>s</div>
        
        <h3>Players in Room:</h3>
        <ul id="player-list"></ul>

        <!-- START GAME BUTTON -->
        <button id="start-game-btn" class="btn-secondary hidden" onclick="startNewGame()">Start Game</button>

        <!-- AREA WHERE BLACK CARD WILL SHOW UP -->
        <div id="black-card-container"></div>

        <!-- SHARED TABLE / SUBMISSIONS AREA -->
        <h4 style="margin: 15px 0 5px 0; color: #aaa;" id="table-heading">Round Table (Submissions):</h4>
        <div id="table-container">
            <p style="color: #666; font-size: 13px; margin: auto;">No cards submitted yet.</p>
        </div>

        <!-- AREA WHERE WHITE CARDS WILL SHOW UP -->
        <div id="hand-container"></div>

        <!-- CONFIRM / UNDO SUBMISSION BUTTONS -->
        <button id="submit-card-btn" class="btn-secondary hidden" onclick="confirmSubmission()">Lock In Final Submission</button>
        <button id="undo-card-btn" class="btn-warning hidden" onclick="undoSubmission()">Undo Submission</button>

        <button class="btn-danger" style="margin-top: 15px;" onclick="leaveRoom()">Leave Room</button>
    </div>

    <!-- Firebase SDK Modular Imports via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, push, onValue, remove, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx_cYc7rA03ohzMqeuti5gG1qa1K7JVrM",
            authDomain: "cah-clone-b60b4.firebaseapp.com",
            databaseURL: "https://cah-clone-b60b4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cah-clone-b60b4",
            storageBucket: "cah-clone-b60b4.appspot.com",
            messagingSenderId: "976107171722",
            appId: "1:976107171722:web:9edca7e092d80d20912273"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbUpdate = update;
        window.dbPush = push;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
        window.dbOnDisconnect = onDisconnect;
        window.dbGet = get;

        loadRooms();
    </script>

    <script>
        let currentRoomId = null;
        let currentPlayerId = null;
        let currentPlayerName = null;
        let roomHostName = null;

        let allCardsData = null;
        let blackCards = [];
        let whiteCards = [];
        let myHand = [];
        let currentBlackCard = null;
        let selectedCharArrayIdx = null;
        let roomStatus = "waiting";
        let playerCount = 0;
        let isLockedIn = false;
        let cardsLoaded = false;
        let timerInterval = null;
        let roundEndTime = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('cah_authenticated') === 'true') {
                const savedRoomId = sessionStorage.getItem('cah_room_id');
                const savedPlayerName = sessionStorage.getItem('cah_player_name');

                if (savedRoomId && savedPlayerName) {
                    document.getElementById('password-screen').classList.add('hidden');
                    document.getElementById('player-name').value = savedPlayerName;
                    setTimeout(() => { joinRoom(savedRoomId, savedPlayerName); }, 500);
                } else {
                    document.getElementById('password-screen').classList.add('hidden');
                    document.getElementById('lobby-screen').classList.remove('hidden');
                }
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        async function loadCards() {
            try {
                const response = await fetch('cah-all-full.json');
                allCardsData = await response.json();
                
                allCardsData.forEach(pack => {
                    if (pack.black) blackCards.push(...pack.black);
                    if (pack.white) whiteCards.push(...pack.white);
                });

                shuffleArray(blackCards);
                shuffleArray(whiteCards);
                cardsLoaded = true;

                if (roomStatus === "submitting" && myHand.length === 0) {
                    dealInitialHand();
                }
            } catch (error) {
                console.error("Error loading cards:", error);
            }
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const pass = document.getElementById('password-input').value;
            const correctHash = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
            if ((await sha256(pass)) === correctHash) {
                sessionStorage.setItem('cah_authenticated', 'true');
                document.getElementById('password-screen').classList.add('hidden');
                document.getElementById('lobby-screen').classList.remove('hidden');
            } else {
                alert("Incorrect password.");
            }
        }

        function createRoom() {
            const playerName = document.getElementById('player-name').value.trim();
            if (!playerName) return alert("Please enter your player name first!");

            const newRoomRef = window.dbPush(window.dbRef(window.db, 'rooms'));
            currentRoomId = newRoomRef.key;

            window.dbSet(newRoomRef, { host: playerName, status: "waiting" }).then(() => {
                joinRoom(currentRoomId, playerName);
            });
        }

        function joinRoom(roomId, forcedName = null) {
            const playerName = forcedName || document.getElementById('player-name').value.trim();
            if (!playerName) return alert("Please enter your name!");

            currentPlayerName = playerName;
            currentRoomId = roomId;

            sessionStorage.setItem('cah_room_id', roomId);
            sessionStorage.setItem('cah_player_name', playerName);

            const newPlayerRef = window.dbPush(window.dbRef(window.db, `rooms/${roomId}/players`));
            currentPlayerId = newPlayerRef.key;

            window.dbOnDisconnect(newPlayerRef).remove();

            window.dbSet(newPlayerRef, { name: playerName, score: 0, lockedIn: false }).then(() => {
                enterRoomView("Room " + roomId.substring(1, 6));
                listenToRoomPlayers(roomId);
                listenToRoomStatus(roomId);
                listenToRoomSubmissions(roomId);
            });
        }

        function enterRoomView(roomTitleText) {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('room-title').innerText = roomTitleText;
        }

        function listenToRoomPlayers(roomId) {
            window.dbOnValue(window.dbRef(window.db, `rooms/${roomId}/players`), (snapshot) => {
                const playersData = snapshot.val();
                if (!playersData) return;

                const playerListEl = document.getElementById('player-list');
                playerListEl.innerHTML = "";
                playerCount = 0;

                for (const pId in playersData) {
                    playerCount++;
                    const player = playersData[pId];
                    const li = document.createElement('li');
                    const isYou = pId === currentPlayerId ? " (You)" : "";
                    const statusTag = player.lockedIn ? " ✅ Locked In" : " ⏳ Choosing";
                    li.innerText = `${player.name}${isYou} — Points: ${player.score || 0}${roomStatus === 'submitting' ? statusTag : ''}`;
                    playerListEl.appendChild(li);
                }

                updateStartButtonVisibility();
            });
        }

        function listenToRoomStatus(roomId) {
            window.dbOnValue(window.dbRef(window.db, `rooms/${roomId}`), (snapshot) => {
                const roomData = snapshot.val();
                if (!roomData) return;

                roomStatus = roomData.status || "waiting";
                roomHostName = roomData.host;
                roundEndTime = roomData.roundEndTime || null;

                updateStartButtonVisibility();
                handleTimer(roundEndTime);

                if (roomData.currentBlackCard) {
                    currentBlackCard = roomData.currentBlackCard;
                    renderBlackCard();
                }

                if (roomStatus === "submitting") {
                    if (myHand.length === 0 && cardsLoaded) dealInitialHand();
                    document.getElementById('table-heading').innerText = "Submissions (Hidden until voting):";
                } else if (roomStatus === "voting") {
                    document.getElementById('table-heading').innerText = "Vote for the Best Card!";
                    renderVotingTable(roomData.submissions || {}, roomData.votes || {});
                }
            });
        }

        function handleTimer(endTime) {
            const timerEl = document.getElementById('timer-display');
            const secEl = document.getElementById('timer-sec');

            if (!endTime || roomStatus !== "submitting") {
                clearInterval(timerInterval);
                timerEl.classList.add('hidden');
                return;
            }

            timerEl.classList.remove('hidden');
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
                secEl.innerText = remaining;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    if (!isLockedIn) {
                        if (selectedCharArrayIdx === null && myHand.length > 0) {
                            selectedCharArrayIdx = 0;
                        }
                        confirmSubmission();
                    }
                    checkAndTriggerVotingPhase();
                }
            }, 1000);
        }

        function startNewGame() {
            const roomRef = window.dbRef(window.db, `rooms/${currentRoomId}`);
            if (blackCards.length > 0) {
                const pickedBlack = blackCards.pop();
                const endTime = Date.now() + 30000;

                // Reset player lock status for the new round
                window.dbGet(window.dbRef(window.db, `rooms/${currentRoomId}/players`)).then((snap) => {
                    if (snap.exists()) {
                        const players = snap.val();
                        for (const pId in players) {
                            window.dbUpdate(window.dbRef(window.db, `rooms/${currentRoomId}/players/${pId}`), { lockedIn: false });
                        }
                    }
                });

                isLockedIn = false;
                selectedCharArrayIdx = null;
                document.getElementById('undo-card-btn').classList.add('hidden');
                document.getElementById('submit-card-btn').classList.add('hidden');

                window.dbUpdate(roomRef, {
                    status: "submitting",
                    currentBlackCard: pickedBlack,
                    roundEndTime: endTime,
                    submissions: null,
                    votes: null
                });
            }
        }

        function dealInitialHand() {
            myHand = [];
            for (let i = 0; i < 7; i++) {
                if (whiteCards.length > 0) myHand.push(whiteCards.pop());
            }
            renderHand();
        }

        function renderBlackCard() {
            const blackContainer = document.getElementById('black-card-container');
            blackContainer.innerHTML = "";
            if (currentBlackCard) {
                const text = typeof currentBlackCard === 'object' ? currentBlackCard.text : currentBlackCard;
                blackContainer.innerHTML = `
                    <div class="black-card">
                        <span>${text}</span>
                        <span style="font-size: 10px; color: #aaa;">Cards Against Humanity</span>
                    </div>`;
            }
        }

        function renderHand() {
            const handContainer = document.getElementById('hand-container');
            handContainer.innerHTML = ""; 

            myHand.forEach((card, index) => {
                const cardText = typeof card === 'object' ? card.text : card;
                const cardDiv = document.createElement('div');
                cardDiv.className = `white-card ${isLockedIn ? 'disabled' : ''}`;
                if (selectedCharArrayIdx === index) cardDiv.classList.add('selected');
                
                cardDiv.onclick = () => {
                    if (!isLockedIn) selectCard(index);
                };
                cardDiv.innerHTML = `<span>${cardText}</span><span style="font-size: 10px; color: #555;">CAH</span>`;
                handContainer.appendChild(cardDiv);
            });
        }

        function selectCard(index) {
            selectedCharArrayIdx = index;
            renderHand();
            document.getElementById('submit-card-btn').classList.remove('hidden');
        }

        function confirmSubmission() {
            if (selectedCharArrayIdx === null) return;

            const chosenCard = myHand[selectedCharArrayIdx];
            const cardText = typeof chosenCard === 'object' ? chosenCard.text : chosenCard;

            window.dbSet(window.dbRef(window.db, `rooms/${currentRoomId}/submissions/${currentPlayerId}`), {
                playerName: currentPlayerName,
                cardText: cardText
            });

            window.dbUpdate(window.dbRef(window.db, `rooms/${currentRoomId}/players/${currentPlayerId}`), {
                lockedIn: true
            });

            isLockedIn = true;
            document.getElementById('submit-card-btn').classList.add('hidden');
            document.getElementById('undo-card-btn').classList.remove('hidden');
            renderHand();

            checkAndTriggerVotingPhase();
        }

        function undoSubmission() {
            if (!isLockedIn || roomStatus !== "submitting") return;

            window.dbRemove(window.dbRef(window.db, `rooms/${currentRoomId}/submissions/${currentPlayerId}`));
            window.dbUpdate(window.dbRef(window.db, `rooms/${currentRoomId}/players/${currentPlayerId}`), {
                lockedIn: false
            });

            isLockedIn = false;
            document.getElementById('undo-card-btn').classList.add('hidden');
            document.getElementById('submit-card-btn').classList.remove('hidden');
            renderHand();
        }

        function checkAndTriggerVotingPhase() {
            if (currentPlayerName !== roomHostName) return;

            window.dbGet(window.dbRef(window.db, `rooms/${currentRoomId}`)).then((snapshot) => {
                const roomData = snapshot.val();
                if (!roomData || roomData.status !== "submitting") return;

                const players = roomData.players || {};
                const submissions = roomData.submissions || {};

                const playerKeys = Object.keys(players);
                const submissionKeys = Object.keys(submissions);

                if (submissionKeys.length >= playerKeys.length || (roundEndTime && Date.now() >= roundEndTime)) {
                    window.dbUpdate(window.dbRef(window.db, `rooms/${currentRoomId}`), {
                        status: "voting"
                    });
                }
            });
        }

        function listenToRoomSubmissions(roomId) {
            window.dbOnValue(window.dbRef(window.db, `rooms/${roomId}/submissions`), (snapshot) => {
                const submissionsData = snapshot.val();
                const tableContainer = document.getElementById('table-container');

                if (roomStatus === "submitting") {
                    const count = submissionsData ? Object.keys(submissionsData).length : 0;
                    tableContainer.innerHTML = `<p style="color: #aaa; font-size: 14px; margin: auto;">${count} card(s) locked in face-down...</p>`;
                }
            });
        }

        function renderVotingTable(submissions, votes) {
            const tableContainer = document.getElementById('table-container');
            tableContainer.innerHTML = "";

            if (Object.keys(submissions).length === 0) {
                tableContainer.innerHTML = `<p style="color: #888;">No cards were submitted this round.</p>`;
                return;
            }

            const myVoteTarget = votes[currentPlayerId];

            for (const subPlayerId in submissions) {
                const sub = submissions[subPlayerId];
                const isMyCard = subPlayerId === currentPlayerId;
                const isVotedThis = myVoteTarget === subPlayerId;

                const cardDiv = document.createElement('div');
                cardDiv.className = `table-card ${isVotedThis ? 'voted' : ''}`;
                cardDiv.innerHTML = `
                    <span>${sub.cardText}</span>
                    <div>
                        <span style="font-size:9px; color:#555;">${isMyCard ? '(Your Card)' : ''}</span>
                        <button onclick="castVote('${subPlayerId}')">${isVotedThis ? 'Voted ✓' : 'Vote'}</button>
                    </div>
                `;
                tableContainer.appendChild(cardDiv);
            }
        }

        function castVote(targetPlayerId) {
            window.dbSet(window.dbRef(window.db, `rooms/${currentRoomId}/votes/${currentPlayerId}`), targetPlayerId).then(() => {
                // Refresh hand to draw replacement card for next round
                if (selectedCharArrayIdx !== null) {
                    myHand.splice(selectedCharArrayIdx, 1);
                    if (whiteCards.length > 0) myHand.push(whiteCards.pop());
                    selectedCharArrayIdx = null;
                }
                renderHand();
            });
        }

        function updateStartButtonVisibility() {
            const btn = document.getElementById('start-game-btn');
            if (currentPlayerName === roomHostName && (roomStatus === "waiting" || roomStatus === "voting") && playerCount >= 2) {
                btn.classList.remove('hidden');
                btn.innerText = roomStatus === "waiting" ? "Start Game" : "Next Round";
            } else {
                btn.classList.add('hidden');
            }
        }

        function leaveRoom() {
            sessionStorage.removeItem('cah_room_id');
            sessionStorage.removeItem('cah_player_name');

            if (currentRoomId && currentPlayerId) {
                window.dbRemove(window.dbRef(window.db, `rooms/${currentRoomId}/players/${currentPlayerId}`));
            }
            location.reload();
        }

        function cleanupStaleRooms() {
            window.dbGet(window.dbRef(window.db, 'rooms')).then((snapshot) => {
                if (!snapshot.exists()) return alert("No rooms to clean.");
                const rooms = snapshot.val();
                let cleaned = 0;
                for (const rId in rooms) {
                    if (!rooms[rId].players) {
                        window.dbRemove(window.dbRef(window.db, `rooms/${rId}`));
                        cleaned++;
                    }
                }
                alert(`Cleaned ${cleaned} room(s).`);
            });
        }

        function loadRooms() {
            window.dbOnValue(window.dbRef(window.db, 'rooms'), (snapshot) => {
                const data = snapshot.val();
                const roomsListEl = document.getElementById('rooms-list');
                roomsListEl.innerHTML = "";

                if (!data) return roomsListEl.innerHTML = '<p style="color: #888;">No active rooms.</p>';

                for (const roomId in data) {
                    const roomDiv = document.createElement('div');
                    roomDiv.className = 'room-item';
                    roomDiv.innerHTML = `<span><strong>${data[roomId].host}'s Room</strong></span><button onclick="joinRoom('${roomId}')">Join</button>`;
                    roomsListEl.appendChild(roomDiv);
                }
            });
        }

        loadCards();
    </script>
</body>
</html>
