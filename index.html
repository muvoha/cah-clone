<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards Against Humanity Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            box-sizing: border-box;
            font-size: 16px;
        }
        input {
            background-color: #2a2a2a;
            color: #ffffff;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            background-color: #3700b3;
        }
        .btn-danger {
            background-color: #cf6679;
            color: #000;
        }
        .btn-secondary {
            background-color: #03dac6;
            color: #000;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        .room-item {
            background-color: #2a2a2a;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .room-item button {
            width: auto;
            padding: 8px 14px;
            margin-top: 0;
            font-size: 14px;
            background-color: #03dac6;
            color: #000;
        }
        ul {
            padding-left: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <!-- PASSWORD SCREEN -->
    <div id="password-screen" class="container">
        <h2>CAH Clone</h2>
        <p>Enter password to access:</p>
        <input type="password" id="password-input" placeholder="Password">
        <button onclick="checkPassword()">Enter</button>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="container hidden">
        <h2>Game Lobby</h2>
        <input type="text" id="player-name" placeholder="Enter your player name">
        <button onclick="createRoom()">Create New Room</button>
        
        <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
        
        <h3>Available Rooms</h3>
        <div id="rooms-list">
            <p style="color: #888;">Loading rooms...</p>
        </div>
        <button class="btn-secondary" onclick="cleanupStaleRooms()">Clear Empty Rooms</button>
    </div>

    <!-- ACTIVE ROOM SCREEN -->
    <div id="room-screen" class="container hidden">
        <h2 id="room-title">Room</h2>
        <p>Waiting for players...</p>
        
        <h3>Players in Room:</h3>
        <ul id="player-list">
            <!-- Dynamic players list -->
        </ul>

        <button class="btn-danger" onclick="leaveRoom()">Leave Room</button>
    </div>

    <!-- Firebase SDK Modular Imports via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx_cYc7rA03ohzMqeuti5gG1qa1K7JVrM",
            authDomain: "cah-clone-b60b4.firebaseapp.com",
            databaseURL: "https://cah-clone-b60b4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cah-clone-b60b4",
            storageBucket: "cah-clone-b60b4.appspot.com",
            messagingSenderId: "976107171722",
            appId: "1:976107171722:web:9edca7e092d80d20912273"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbPush = push;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
        window.dbOnDisconnect = onDisconnect;
        window.dbGet = get;

        loadRooms();
    </script>

    <script>
        let currentRoomId = null;
        let currentPlayerId = null;
        let currentPlayerName = null;

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const pass = document.getElementById('password-input').value;
            const correctHash = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
            const userHash = await sha256(pass);

            if (userHash === correctHash) {
                document.getElementById('password-screen').classList.add('hidden');
                document.getElementById('lobby-screen').classList.remove('hidden');
            } else {
                alert("Incorrect password.");
            }
        }

        function createRoom() {
            const playerName = document.getElementById('player-name').value.trim();
            if (!playerName) {
                alert("Please enter your player name first!");
                return;
            }

            const roomsRef = window.dbRef(window.db, 'rooms');
            const newRoomRef = window.dbPush(roomsRef);
            currentRoomId = newRoomRef.key;
            
            const roomData = {
                host: playerName,
                status: "waiting"
            };

            window.dbSet(newRoomRef, roomData).then(() => {
                joinRoom(currentRoomId, playerName);
            }).catch((error) => {
                alert("Failed to create room: " + error.message);
            });
        }

        function joinRoom(roomId, forcedName = null) {
            const playerName = forcedName || document.getElementById('player-name').value.trim();
            if (!playerName) {
                alert("Please enter your player name in the box above before joining!");
                return;
            }

            currentPlayerName = playerName;
            currentRoomId = roomId;

            const playersRef = window.dbRef(window.db, `rooms/${roomId}/players`);
            const newPlayerRef = window.dbPush(playersRef);
            currentPlayerId = newPlayerRef.key;

            // Remove only this player entry upon disconnection
            window.dbOnDisconnect(newPlayerRef).remove();

            window.dbSet(newPlayerRef, { name: playerName }).then(() => {
                enterRoomView("Room " + roomId.substring(1, 6));
                listenToRoomPlayers(roomId);
            }).catch((error) => {
                alert("Failed to join room: " + error.message);
            });
        }

        function enterRoomView(roomTitleText) {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
            document.getElementById('room-title').innerText = roomTitleText;
        }

        function listenToRoomPlayers(roomId) {
            const playersRef = window.dbRef(window.db, `rooms/${roomId}/players`);
            const playerListEl = document.getElementById('player-list');

            window.dbOnValue(playersRef, (snapshot) => {
                const playersData = snapshot.val();
                
                if (!playersData) {
                    // If no players remain in this room, delete the room node entirely from Firebase
                    const roomRef = window.dbRef(window.db, `rooms/${roomId}`);
                    window.dbRemove(roomRef);
                    return;
                }

                playerListEl.innerHTML = "";
                for (const pId in playersData) {
                    const player = playersData[pId];
                    const li = document.createElement('li');
                    const isYou = pId === currentPlayerId ? " (You)" : "";
                    li.innerText = player.name + isYou;
                    playerListEl.appendChild(li);
                }
            });
        }

        function leaveRoom() {
            if (currentRoomId && currentPlayerId) {
                const playerRef = window.dbRef(window.db, `rooms/${currentRoomId}/players/${currentPlayerId}`);
                window.dbRemove(playerRef).then(() => {
                    // Check immediately if any players are left; if not, remove the room
                    const playersRef = window.dbRef(window.db, `rooms/${currentRoomId}/players`);
                    window.dbGet(playersRef).then((snapshot) => {
                        if (!snapshot.exists()) {
                            const roomRef = window.dbRef(window.db, `rooms/${currentRoomId}`);
                            window.dbRemove(roomRef);
                        }
                    });
                });
            }
            currentRoomId = null;
            currentPlayerId = null;
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function cleanupStaleRooms() {
            const roomsRef = window.dbRef(window.db, 'rooms');
            window.dbGet(roomsRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    alert("No rooms to clean.");
                    return;
                }

                const rooms = snapshot.val();
                let cleanedCount = 0;

                for (const roomId in rooms) {
                    const room = rooms[roomId];
                    // If a room has no players node or the players node is empty, delete it
                    if (!room.players || Object.keys(room.players).length === 0) {
                        window.dbRemove(window.dbRef(window.db, `rooms/${roomId}`));
                        cleanedCount++;
                    }
                }
                alert(`Cleanup complete! Removed ${cleanedCount} empty room(s).`);
            });
        }

        function loadRooms() {
            const roomsListEl = document.getElementById('rooms-list');
            const roomsRef = window.dbRef(window.db, 'rooms');

            window.dbOnValue(roomsRef, (snapshot) => {
                const data = snapshot.val();
                roomsListEl.innerHTML = "";

                if (!data) {
                    roomsListEl.innerHTML = '<p style="color: #888;">No active rooms. Create one above!</p>';
                    return;
                }

                for (const roomId in data) {
                    const room = data[roomId];
                    const roomDiv = document.createElement('div');
                    roomDiv.className = 'room-item';
                    roomDiv.innerHTML = `
                        <span><strong>${room.host}'s Room</strong></span>
                        <button onclick="joinRoom('${roomId}')">Join</button>
                    `;
                    roomsListEl.appendChild(roomDiv);
                }
            });
        }
    </script>
</body>
</html>
